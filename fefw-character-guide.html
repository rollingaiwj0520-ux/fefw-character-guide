<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>角色培养与招募</title>
  <style>
    :root { --paper:#f5f4ee; --card:#fff; --ink:#202d35; --muted:#67747b; --line:#e0e5e1; --accent:#237872; --hero:#237872; --radius:18px; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; line-height:1.65; }
    button,input,select { font:inherit; }
    button,select { cursor:pointer; }
    a { color:var(--accent); text-underline-offset:3px; }
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible { outline:3px solid #49a49c; outline-offset:3px; }
    .masthead { position:relative; overflow:hidden; background:#1e343b; color:#fff; padding:44px 28px 70px; }
    .masthead:after { content:""; position:absolute; width:390px; height:390px; border:1px solid #ffffff14; border-radius:50%; right:-58px; top:-194px; box-shadow:0 0 0 65px #ffffff04,0 0 0 130px #ffffff03; pointer-events:none; }
    .header-inner,.main { max-width:1456px; margin:auto; }
    .eyebrow { font-size:12px; letter-spacing:.18em; color:#a5cebf; margin:0 0 12px; font-weight:700; }
    h1 { margin:0 0 13px; font-size:clamp(26px,3.5vw,42px); line-height:1.3; letter-spacing:-.035em; max-width:1100px; }
    .intro { margin:0; color:#cbd9dc; font-size:15px; max-width:1000px; }
    .meta { margin-top:18px; display:flex; flex-wrap:wrap; gap:8px 20px; font-size:13px; color:#aebfc3; }
    .meta a { color:#e1f3e9; }
    .main { padding:0 24px 44px; }
    .route-panel { position:relative; margin-top:-36px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:25px 28px 22px; box-shadow:0 8px 32px #18323808; }
    .panel-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:15px; }
    .label { margin:0; font-size:13px; font-weight:750; color:var(--muted); letter-spacing:.06em; }
    .route-tag { font-size:12px; color:var(--accent); padding:3px 10px; background:#eaf4ef; border-radius:99px; white-space:nowrap; }
    .heroes { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
    .hero-button { position:relative; display:flex; align-items:center; gap:13px; padding:16px; background:#fafbf8; color:var(--ink); text-align:left; border:1px solid var(--line); border-radius:12px; transition:background .15s,border-color .15s,box-shadow .15s; }
    .hero-button:hover { border-color:var(--hero); background:#f4f8f4; }
    .hero-button[aria-pressed="true"] { border-color:var(--hero); background:#f0f7f2; box-shadow:inset 0 0 0 1px var(--hero); }
    .portrait { flex:0 0 48px; display:flex; align-items:center; justify-content:center; width:48px; height:48px; overflow:hidden; border:1px solid #d7e1d8; border-radius:11px; background:#e9eee4; color:#6d8272; font-size:19px; font-weight:750; }
    .portrait img { display:block; width:100%; height:100%; object-fit:cover; object-position:center 24%; }
    .hero-portrait { flex-basis:46px; width:46px; height:46px; border-color:var(--hero); }
    .hero-copy { min-width:0; }
    .hero-name { display:block; font-weight:800; font-size:17px; }
    .hero-name-ja { display:block; font-size:11px; line-height:1.5; color:#829186; overflow-wrap:anywhere; }
    .hero-button small { display:block; margin-top:1px; font-size:11px; color:var(--muted); }
    .hero-button[aria-pressed="true"] small { color:var(--hero); }
    .route-summary { margin:17px 0 0; font-size:14px; color:var(--muted); }
    .route-summary strong { color:var(--ink); }
    .route-description { margin:5px 0 0; color:var(--muted); font-size:13px; }
    .tools { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; margin:25px 0 14px; }
    .field { display:flex; flex-direction:column; gap:5px; }
    .field label { font-size:12px; color:var(--muted); font-weight:650; }
    .search-field { flex:1 1 280px; }
    input,select { height:44px; background:#fff; border:1px solid #ccd5d0; border-radius:9px; color:var(--ink); padding:0 12px; }
    input { width:100%; }
    select { min-width:142px; }
    input::placeholder { color:#91a098; }
    .download { height:44px; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:9px; padding:0 17px; font-size:14px; font-weight:650; }
    .download:hover { filter:brightness(.93); }
    .sort-note { margin:0 0 22px; font-size:12px; color:var(--muted); }
    .sort-note span { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent); margin-right:6px; vertical-align:2px; }
    .tier-legend { display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin:0 0 12px; }
    .tier-legend-label { margin-right:4px; font-size:12px; color:var(--muted); }
    .tier-legend .rating-badge { padding:2px 8px; font-size:11px; }
    .section { margin:25px 0; }
    .section-heading { display:flex; align-items:center; gap:10px; margin-bottom:13px; }
    h2 { margin:0; font-size:20px; letter-spacing:-.02em; }
    .count { background:#e5eae4; color:#61736a; font-size:12px; min-width:28px; height:23px; padding:0 8px; border-radius:99px; display:inline-flex; align-items:center; justify-content:center; }
    .section-note { margin:-5px 0 13px; font-size:13px; color:var(--muted); }
    .table-shell { overflow:auto; border:1px solid var(--line); border-radius:14px; background:var(--card); }
    table { border-collapse:collapse; width:100%; table-layout:fixed; min-width:1180px; }
    col.character { width:15%; } col.rating { width:8%; } col.role { width:15%; } col.route { width:21%; } col.recruit { width:33%; } col.video { width:8%; }
    th { text-align:left; padding:13px 15px; background:#edf1eb; color:#697a70; font-weight:650; font-size:12px; border-bottom:1px solid var(--line); }
    td { padding:19px 15px; border-bottom:1px solid var(--line); vertical-align:top; font-size:14px; overflow-wrap:anywhere; }
    tr:last-child td { border-bottom:0; }
    tbody tr:hover { background:#fcfdf9; }
    .character-identity { display:flex; align-items:flex-start; gap:10px; }
    .character-copy { min-width:0; }
    .character-name { display:block; font-size:16px; font-weight:800; }
    .character-name-ja { display:block; margin-top:2px; font-size:12px; line-height:1.5; color:#829186; }
    .character-index { display:block; margin-top:3px; color:#89968c; font-size:11px; font-variant-numeric:tabular-nums; }
    .rating-badge { display:inline-block; font-weight:800; padding:4px 10px; border-radius:7px; white-space:normal; font-size:13px; line-height:1.55; }
    .tier-ss { background:#fff0d1; color:#956110; } .tier-sp { background:#f8dde5; color:#a33d5b; } .tier-s { background:#f8e8dc; color:#a65428; } .tier-a { background:#e3f1e8; color:#387851; } .tier-b { background:#e7edf8; color:#4c65a0; } .tier-c { background:#efe9f1; color:#80648a; } .tier-other { background:#eef0ef; color:#65736c; }
    .body-text { margin:0; white-space:pre-line; }
    .character-note { margin:8px 0 0; color:var(--muted); font-size:12px; white-space:pre-line; }
    .recruit-chips { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:7px; }
    .chip { display:inline-block; border-radius:5px; background:#eff3ef; color:#60776b; padding:1px 7px; font-size:11px; line-height:1.8; }
    .chip.early { background:#e0f0eb; color:#2e7965; font-weight:650; }
    .hint-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
    .hint-chip { display:inline-flex; align-items:center; gap:5px; padding:3px 8px; border:1px solid #c7dbcf; border-radius:6px; background:#f3f8f2; color:#3c7960; font-size:12px; line-height:1.65; text-align:left; }
    .hint-chip:after { content:"?"; display:inline-flex; align-items:center; justify-content:center; width:13px; height:13px; border:1px solid #8cb49d; border-radius:50%; font-size:9px; font-weight:750; flex:0 0 13px; }
    .hint-chip:hover,.hint-chip[aria-expanded="true"] { border-color:#6c9d85; background:#e7f2e8; }
    .hint-popover[hidden] { display:none; }
    .hint-popover { position:fixed; z-index:1000; width:min(380px,calc(100vw - 24px)); max-height:calc(100vh - 24px); overflow:auto; padding:17px 18px; border:1px solid #bdd2c5; border-radius:13px; background:#fffef8; box-shadow:0 12px 45px #173d3328; }
    .hint-header { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; }
    .hint-title { margin:0; font-size:16px; line-height:1.5; font-weight:800; color:#2e5743; }
    .hint-close { flex:0 0 26px; width:26px; height:26px; padding:0; border:0; border-radius:6px; background:#eef2eb; color:#698573; font-size:20px; line-height:1; }
    .hint-character { margin:3px 0 10px; color:#859286; font-size:11px; }
    .hint-steps { margin:0; padding-left:20px; font-size:13px; line-height:1.8; }
    .hint-steps li + li { margin-top:5px; }
    .hint-source { display:inline-block; margin-top:12px; font-size:12px; }
    .order-note { margin:7px 0 0; font-size:12px; color:#819086; white-space:pre-line; }
    .video-link { display:inline-flex; align-items:center; gap:5px; white-space:nowrap; font-size:13px; font-variant-numeric:tabular-nums; text-decoration:none; border-bottom:1px solid #c4dacf; }
    .video-link:before { content:"▶"; font-size:9px; }
    .empty { margin:0; padding:30px 22px; color:var(--muted); font-size:14px; text-align:center; }
    details { border:1px solid var(--line); border-radius:12px; background:#fafbf7; margin-top:24px; }
    summary { padding:15px 18px; font-weight:650; cursor:pointer; font-size:14px; }
    .unavailable > summary { color:var(--muted); }
    details[open] > summary { border-bottom:1px solid var(--line); }
    details .table-shell { border:0; border-radius:0 0 12px 12px; }
    .sources-body { padding:15px 22px 20px; color:var(--muted); font-size:13px; }
    .sources-body p { margin:0 0 8px; }
    .source-list { margin:0; padding-left:18px; }
    .source-list li + li { margin-top:5px; }
    .footer { padding:16px 3px 0; font-size:11px; color:#8e9991; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (max-width:1100px) { .hero-button { padding:13px 12px; gap:9px; } .hero-portrait { flex-basis:40px; width:40px; height:40px; } .hero-name { font-size:15px; } }
    @media (max-width:820px) {
      .masthead { padding:30px 20px 60px; } .main { padding:0 16px 30px; } .route-panel { padding:21px 18px; margin-top:-30px; } .heroes { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
      .hero-button { padding:12px; } .hero-name { font-size:16px; } .route-summary { font-size:13px; } .tools { gap:9px; } .search-field { flex-basis:100%; } .field:not(.search-field) { flex:1 1 120px; } select { min-width:0; width:100%; } .download { margin-left:auto; padding:0 13px; }
      .hero-name-ja { font-size:10px; } .character-identity { gap:9px; } .portrait { flex-basis:44px; width:44px; height:44px; } .hero-portrait { flex-basis:40px; width:40px; height:40px; } .character-name-ja { font-size:11px; }
      h2 { font-size:18px; } .table-shell { border:0; overflow:visible; background:transparent; } table,tbody,tr,td { display:block; width:100%; min-width:0; } colgroup,thead { display:none; }
      tbody { display:grid; gap:12px; } tr { position:relative; border:1px solid var(--line); border-radius:12px; background:#fff; padding:16px; } td { border:0; padding:0; font-size:14px; }
      td:nth-child(1) { padding-right:110px; margin-bottom:15px; } td:nth-child(2) { position:absolute; right:16px; top:16px; width:auto; max-width:100px; } .character-name { font-size:18px; } .character-index { margin-top:0; } td:nth-child(n+3) { margin-top:13px; } td:nth-child(n+3):before { content:attr(data-label); display:block; margin-bottom:4px; font-size:11px; font-weight:700; color:#8c998f; letter-spacing:.06em; }
      .character-note { margin-top:5px; } .recruit-chips { margin-top:4px; } details .table-shell { padding:12px; } .sources-body { padding:13px 18px; } .sort-note { line-height:1.8; } .panel-top { margin-bottom:13px; } .route-tag { font-size:11px; }
    }

      body { background:#fff; color:#111; font-size:10px; } .masthead { background:#fff; color:#111; padding:0; } .masthead:after,.eyebrow,.intro,.heroes,.tools,.sort-note,.route-tag,.footer { display:none!important; } h1 { font-size:22px; } .header-inner,.main { max-width:none; padding:0; } .meta { color:#555; margin:8px 0; } .meta a { color:#444; } .route-panel { margin:10px 0; padding:10px 0; box-shadow:none; border:0; border-top:1px solid #ccc; border-bottom:1px solid #ccc; border-radius:0; } .panel-top { display:none; } .route-summary,.route-description { margin:0; font-size:11px; } .section { margin:18px 0; } h2 { font-size:16px; } .section-note { font-size:10px; } .table-shell { overflow:visible; border-radius:0; } table { min-width:0; font-size:10px; } th,td { padding:7px 6px; font-size:10px; } .character-name { font-size:12px; } .rating-badge { padding:2px 5px; font-size:10px; } .character-note,.order-note { font-size:9px; } .chip { font-size:9px; } .video-link { font-size:9px; } tr { break-inside:avoid; } .sources,.unavailable { display:none; } a { color:#111; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="header-inner">
      <p class="eyebrow">培养推荐 × 招募路线</p>
      <h1 id="page-title"></h1>
      <p class="intro">选定主人公，查看角色的培养推荐、主要作用与转职路线，并按当前路线的入队条件排列。</p>
      <div class="meta" id="metadata"></div>
    </div>
  </header>
  <main class="main">
    <section class="route-panel" aria-labelledby="route-label">
      <div class="panel-top"><p class="label" id="route-label">选择主人公</p><span class="route-tag">切换后自动重新排序</span></div>
      <div class="heroes" id="heroes"></div>
      <p class="route-summary" id="route-summary" role="status" aria-live="polite"></p>
      <p class="route-description" id="route-description"></p>
    </section>
    <div class="tools" aria-label="表格筛选与导出">
      <div class="field search-field"><label for="search">搜索中文名、日文名、作用、职业或招募条件</label><input id="search" type="search" placeholder="输入名称或关键词" autocomplete="off"></div>
      <div class="field"><label for="rating-filter">推荐等级</label><select id="rating-filter"><option value="all">全部等级</option></select></div>
      <div class="field"><label for="sort">排序方式</label><select id="sort"><option value="join">建议入队顺序</option><option value="tier">推荐等级</option></select></div>
      <button class="download" id="download" type="button">下载当前路线 CSV</button>
    </div>
    <div class="tier-legend" id="tier-legend" aria-label="视频推荐等级"><span class="tier-legend-label">视频推荐等级</span></div>
    <p class="sort-note"><span aria-hidden="true"></span>剧情队友在前；普通挖角按名声、支援要求排列；外传和退赛前置角色按开放时间排列。出现章节、材料和任务要求见每行。悬停或点击招募提示可查看获取方法，点击视频时间可查看对应讲解。</p>
    <div id="tables"></div>
    <details class="sources"><summary>内容来源与整理说明</summary><div class="sources-body"><p>推荐等级、主要作用与转职路线依据视频整理；入队条件随所选主人公切换。</p><ul class="source-list" id="source-list"></ul></div></details>
    <div class="footer" id="footer"></div>
  </main>
  <aside class="hint-popover" id="recruit-hint" role="dialog" aria-modal="false" aria-labelledby="hint-title" aria-describedby="hint-steps" tabindex="-1" hidden>
    <div class="hint-header"><h3 class="hint-title" id="hint-title"></h3><button class="hint-close" id="hint-close" type="button" aria-label="关闭获取提示">×</button></div>
    <p class="hint-character" id="hint-character"></p>
    <ol class="hint-steps" id="hint-steps"></ol>
    <div id="hint-source"></div>
  </aside>

      const hero = DATA.heroes.find(item => item.id === heroId);
      document.querySelectorAll(".hero-button").forEach(button => { const selected = button.dataset.hero === heroId; button.setAttribute("aria-pressed",String(selected)); button.querySelector(".hero-status").textContent = selected ? "当前路线" : "查看招募顺序"; });
      const full = DATA.characters.filter(character => routeOf(character).mode !== "不可招募");
      const firstCount = full.filter(character => routeOf(character).act === 1).length;
      const laterCount = full.filter(character => [2,3].includes(routeOf(character).act)).length;
      const summary = $("route-summary"); summary.replaceChildren(node("strong",hero?.name || ""),document.createTextNode(" 路线 · 第一幕 " + firstCount + " 人 · 第二、三幕 " + laterCount + " 人"));
      $("route-description").textContent = hero?.description || "";
      visibleRows = DATA.characters.filter(matches).sort(compare);
      const first = visibleRows.filter(character => routeOf(character).act === 1 && routeOf(character).mode !== "不可招募");
      const later = visibleRows.filter(character => [2,3].includes(routeOf(character).act) && routeOf(character).mode !== "不可招募");
      const unknown = visibleRows.filter(character => routeOf(character).act == null && routeOf(character).mode !== "不可招募");
      const unavailable = visibleRows.filter(character => routeOf(character).mode === "不可招募");
      const joinSort = $("sort").value === "join";
      const tables = $("tables"); tables.replaceChildren(section("第一幕入队",first,joinSort ? "剧情队友在前；普通挖角按名声、支援要求排列；外传和退赛前置角色按开放时间排列。" : "按推荐等级从高到低排列，入队条件以当前主人公路线为准。"),section("第二、三幕入队",later,joinSort ? "后续入队角色按所属幕和开放顺序排列。" : "按推荐等级从高到低排列，入队条件以当前主人公路线为准。"));
      if (unknown.length) tables.append(section("入队条件待补充",unknown));
      if (unavailable.length) { const details = node("details",null,"unavailable"); details.append(node("summary","本篇第一幕无法招募 · " + unavailable.length + " 人"),table(unavailable,"本篇第一幕无法招募")); tables.append(details); }
      $("footer").textContent = "当前显示 " + visibleRows.length + " 名角色 · CSV 导出包含当前路线与筛选结果";
    };
    $("page-title").textContent = DATA.title || "角色培养与招募"; document.title = DATA.title || "角色培养与招募";
    if (DATA.author) $("metadata").append(node("span","视频作者：" + DATA.author));
    if (DATA.publishedAt) $("metadata").append(node("span","发布：" + DATA.publishedAt));
    if (safeUrl(DATA.videoUrl)) $("metadata").append(externalLink("打开原视频 ↗",DATA.videoUrl));
    DATA.heroes.forEach((hero,index) => {
      const button = node("button",null,"hero-button"); button.type = "button"; button.dataset.hero = hero.id; button.setAttribute("aria-pressed",String(hero.id === heroId));
      const color = /^#[0-9a-f]{3,8}$/i.test(hero.color || "") ? hero.color : "#237872"; button.style.setProperty("--hero",color);
      const heroCharacter = DATA.characters.find(character => character.id === hero.characterId || character.id === hero.id || character.name === hero.name);
      const portraitPath = hero.portrait || heroCharacter?.portrait, nameJa = hero.nameJa || heroCharacter?.nameJa;
      button.append(portrait(portraitPath,hero.name,"hero-portrait")); const text = node("span",null,"hero-copy"); text.append(node("span",hero.name,"hero-name"));
      if (nameJa) { const japanese = node("span",nameJa,"hero-name-ja"); japanese.lang = "ja"; text.append(japanese); }
      text.append(node("small",hero.id === heroId ? "当前路线" : "查看招募顺序","hero-status")); button.append(text);
      button.addEventListener("click",() => { heroId = hero.id; try { history.replaceState(null,"","#hero=" + encodeURIComponent(heroId)); } catch {} render(); }); $("heroes").append(button);
    });
    [...new Set(DATA.characters.map(character => tierKey(character.tier)))].sort((a,b) => tierRank(a)-tierRank(b)).forEach(tier => { const option = node("option",tier + (tier === "未评级" ? "" : " 级")); option.value = tier; $("rating-filter").append(option); $("tier-legend").append(node("span",tier,"rating-badge " + tierClass(tier))); });
    const sources = DATA.sources || [];
    sources.forEach(source => { const item = node("li"); item.append(externalLink(source.label,source.url)); $("source-list").append(item); });
    if (!sources.length && safeUrl(DATA.videoUrl)) { const item = node("li"); item.append(externalLink("原视频",DATA.videoUrl)); $("source-list").append(item); }
    $("search").addEventListener("input",render); $("sort").addEventListener("change",render); $("rating-filter").addEventListener("change",render);
    $("download").addEventListener("click",() => {
      const hero = DATA.heroes.find(item => item.id === heroId);
      const headers = ["主人公","角色","日文名","推荐等级","主要作用","转职路线","培养说明","所属幕","章节","入队方式","入队条件","获取方法","入队排序说明","视频时间","视频链接"];
      const rows = visibleRows.map(character => { const route = routeOf(character); const methods = hintsOf(route).map(hint => [hint.label,...(Array.isArray(hint.steps) ? hint.steps : []),safeUrl(hint.sourceUrl) ? "来源：" + hint.sourceUrl : ""].filter(Boolean).join("\n")).join("\n\n"); return [hero?.name || "",character.name,character.nameJa,character.tier,character.role,character.classRoute,character.note,route.act ?? "",route.chapter ?? "",route.mode,route.condition,methods,route.orderNote,timeLabel(character.videoTime),videoUrl(character.videoTime)]; });
      const cell = value => '"' + String(value ?? "").replace(/"/g,'""') + '"';
      const csv = "\uFEFF" + [headers,...rows].map(row => row.map(cell).join(",")).join("\r\n");
      const url = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"})), link = node("a"); link.href = url; link.download = (hero?.name || "当前主人公") + "路线_角色培养推荐表.csv"; document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url),1000);
    });
    render();
  </script>
</body>
</html>
